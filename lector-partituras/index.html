<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Atril</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: biblioteca en una columna (lista + pestañas) y un atril a pantalla completa con fondo oscuro fijo. */
:root {
  --bg: #f1f2f6; --surface: #ffffff; --fg: #14161c; --muted: #5b6170; --line: #dcdfe8;
  --accent: #3446c4; --accent-fg: #ffffff; --soft: #e4e7f6; --danger: #b8322a;
  --stage: #16181d; --stage-fg: #e9ebf1; --stage-bar: rgba(22,24,29,.94); --stage-line: #2d313b;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101217; --surface: #1a1d24; --fg: #e8eaf0; --muted: #9aa0ae; --line: #2a2e38;
  --accent: #8c98ff; --accent-fg: #0c0f22; --soft: #242a45; --danger: #ff7b6c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101217; --surface: #1a1d24; --fg: #e8eaf0; --muted: #9aa0ae; --line: #2a2e38;
  --accent: #8c98ff; --accent-fg: #0c0f22; --soft: #242a45; --danger: #ff7b6c; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-ui); -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Biblioteca ---------- */
#lib { max-width: 760px; margin: 0 auto; padding-block: 12px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; gap: 12px; padding-block: 8px 4px; }
.brand { font: 700 26px/1 var(--font-head); letter-spacing: -.01em; margin: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
.brand svg { width: 28px; height: 28px; }
.tabs { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 999px; margin-block: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tools { display: flex; gap: 8px; margin-bottom: 10px; }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 12px; white-space: nowrap; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; border-top: 1px solid var(--line); min-height: 64px; }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 6px; background: var(--soft); color: var(--accent); }
.icon-btn { border: 0; background: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--soft); }
.icon-btn svg { width: 22px; height: 22px; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  border: 0; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 14px 20px; font-weight: 600;
  display: flex; gap: 8px; align-items: center; box-shadow: 0 6px 20px rgba(30,40,120,.3); }
.fab svg { width: 20px; height: 20px; }
.note { font-size: 13px; color: var(--muted); margin-top: 14px; }
.warn { background: #fff4d6; color: #5a4300; border-radius: var(--r); padding: 10px 12px; font-size: 13px; margin-bottom: 10px; }
.btn { border: 0; background: var(--accent); color: var(--accent-fg); border-radius: var(--r); padding: 10px 16px; font-weight: 600; }
.btn.ghost { background: var(--soft); color: var(--fg); }
.btn.danger { background: var(--danger); color: #fff; }
.set-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.set-head input { flex: 1; min-width: 0; font: 600 18px var(--font-head); border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; }
.set-head input:focus { border-color: var(--line); background: var(--surface); }
.num { width: 24px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

/* ---------- Hoja inferior (menús y diálogos) ---------- */
#sheetBg { position: fixed; inset: 0; background: rgba(5,8,20,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
#sheet { background: var(--surface); color: var(--fg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; max-height: 85%; overflow: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 12px; }
#sheet h2 { font: 700 18px var(--font-head); margin: 0; overflow-wrap: anywhere; }
#sheet .opt { border: 0; background: var(--soft); border-radius: var(--r); padding: 12px 14px; text-align: left; font-weight: 500; }
#sheet .opt.danger { color: var(--danger); }
#sheet input[type=text] { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 10px 12px; width: 100%; }
#sheet label.check { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line); }
#sheet .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); z-index: 80;
  background: #1d2130; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }

/* ---------- Atril ---------- */
#viewer { position: fixed; inset: 0; background: var(--stage); color: var(--stage-fg); z-index: 20; color-scheme: dark; }
#stage { position: absolute; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-user-select: none; user-select: none; }
#spread { min-height: 100%; display: flex; justify-content: center; align-items: center; gap: 6px; }
#stage.scrolls #spread { align-items: flex-start; }
.pg { position: relative; background: #fff; flex: none; box-shadow: 0 2px 16px rgba(0,0,0,.45); }
.pg canvas { display: block; }
.pg canvas.ov { position: absolute; inset: 0; pointer-events: none; touch-action: auto; }
#viewer.drawing .pg canvas.ov { pointer-events: auto; touch-action: none; cursor: crosshair; }
#vmsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #b9bdc9; }
.bar { position: absolute; left: 0; right: 0; background: var(--stage-bar); display: flex; align-items: center; gap: 4px; z-index: 5;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
#vtop { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 6px; border-bottom: 1px solid var(--stage-line); }
#vbot { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); padding-top: 6px; border-top: 1px solid var(--stage-line); flex-wrap: wrap; }
#viewer:not(.chrome) #vtop, #viewer:not(.chrome) #vbot { display: none; }
.vbtn { border: 0; background: none; color: var(--stage-fg); min-width: 42px; height: 42px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; font-size: 13px; }
.vbtn svg { width: 22px; height: 22px; }
.vbtn[aria-pressed="true"] { background: #2f3550; color: #b8c0ff; }
.vtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; padding: 0 4px; }
.vtitle b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vtitle span { font-size: 12px; color: #9aa0ae; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#slider { flex: 1 1 160px; min-width: 120px; accent-color: #8c98ff; }
#pnum { font-variant-numeric: tabular-nums; font-size: 13px; color: #c9cdd8; min-width: 56px; text-align: center; }
#pchip { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); background: rgba(0,0,0,.65);
  color: #fff; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; pointer-events: none; transition: opacity .4s; z-index: 4; }
#vtoast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%); background: #2f3550; color: #fff;
  padding: 8px 14px; border-radius: 999px; font-size: 14px; pointer-events: none; z-index: 9; max-width: calc(100% - 32px); text-align: center; }
.panel { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); z-index: 6;
  background: #222633; border: 1px solid #353b4b; border-radius: 16px; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
  width: max-content; max-width: calc(100% - 24px); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#viewer:not(.chrome) .panel { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #3a4052; padding: 0; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px #8c98ff; }
.sep { width: 1px; height: 26px; background: #3a4052; margin: 0 2px; }
#mbpm { font: 700 28px/1 var(--font-head); width: 3ch; text-align: center; font-variant-numeric: tabular-nums; }
#mbpmR { width: 140px; accent-color: #8c98ff; }
#mdot { width: 16px; height: 16px; border-radius: 50%; background: #3a4052; transition: background .08s; }
#mdot.on { background: #8c98ff; } #mdot.acc { background: #ffcf5c; }
#mbeats { background: #2a2f3e; border: 1px solid #3a4052; border-radius: 8px; padding: 6px; color: #e9ebf1; }
.mark { position: absolute; background: rgba(52,70,196,.22); border-left: 3px solid #3446c4; border-radius: 3px; pointer-events: none; }
#pRate { width: 130px; accent-color: #8c98ff; }
#pRateL { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 92px; text-align: center; color: #c9cdd8; }
@media (prefers-reduced-motion: reduce) { #pchip, #mdot { transition: none; } }
</style>
</head>
<body>

<main id="lib">
  <div class="top">
    <h1 class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="110" fill="var(--accent)"/><path d="M128 170h256M128 222h256M128 274h256M128 326h256M128 378h256" stroke="var(--accent-fg)" stroke-width="14" opacity=".55"/><ellipse cx="232" cy="352" rx="44" ry="32" transform="rotate(-22 232 352)" fill="var(--accent-fg)"/><path d="M270 344V130q60 20 80 70" fill="none" stroke="var(--accent-fg)" stroke-width="22" stroke-linecap="round"/></svg>Atril</h1>
  </div>
  <div id="warn" class="warn" hidden></div>
  <div class="tabs" role="tablist">
    <button id="tabLib" role="tab" aria-selected="true">Biblioteca</button>
    <button id="tabSets" role="tab" aria-selected="false">Setlists</button>
  </div>
  <section id="paneLib">
    <div class="tools">
      <input id="q" class="search" type="search" placeholder="Buscar partitura" aria-label="Buscar partitura">
      <button id="sortBtn" class="chip" type="button">Recientes</button>
    </div>
    <div id="docList" class="list"></div>
    <p class="note">Abre PDF, imágenes (JPG, PNG, WebP) y MusicXML (.musicxml, .xml, .mxl). Si elegís varias imágenes juntas, se unen como páginas de una misma partitura. Las partituras quedan guardadas en este navegador.</p>
  </section>
  <section id="paneSets" hidden></section>
  <button id="fab" class="fab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Agregar</span></button>
  <input id="file" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.bmp,.musicxml,.xml,.mxl,application/pdf,image/*" hidden>
</main>

<div id="viewer" hidden>
  <div id="stage"><div id="spread"></div></div>
  <div id="vmsg" hidden></div>
  <div id="pchip" style="opacity:0"></div>
  <div id="vtoast" hidden></div>

  <div id="vtop" class="bar">
    <button class="vbtn" id="vBack" aria-label="Volver a la biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vtitle"><b id="vName"></b><span id="vSub"></span></div>
    <button class="vbtn" id="vFull" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div id="vbot" class="bar">
    <button class="vbtn" id="vPrev" aria-label="Página anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <input id="slider" type="range" min="1" max="1" value="1" aria-label="Ir a página">
    <span id="pnum">1 / 1</span>
    <button class="vbtn" id="vNext" aria-label="Página siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="sep"></span>
    <button class="vbtn" id="vFit" aria-pressed="false" title="Ajuste">Página</button>
    <button class="vbtn" id="vDual" aria-pressed="true" title="Dos páginas con el celular horizontal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/></svg></button>
    <button class="vbtn" id="vDraw" aria-pressed="false" aria-label="Anotar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
    <button class="vbtn" id="vPlay" aria-pressed="false" aria-label="Escuchar" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    <button class="vbtn" id="vMetro" aria-pressed="false" aria-label="Metrónomo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 3h6l4 18H5z"/><path d="M12 16l5-9"/></svg></button>
  </div>

  <div id="drawbar" class="panel" hidden>
    <button class="sw" data-pen="ink" style="background:#14161c" aria-label="Lápiz negro"></button>
    <button class="sw" data-pen="red" style="background:#d0312d" aria-label="Lápiz rojo"></button>
    <button class="sw" data-pen="blue" style="background:#1f5fd6" aria-label="Lápiz azul"></button>
    <button class="sw" data-pen="hl" style="background:#ffd400" aria-label="Resaltador"></button>
    <span class="sep"></span>
    <button class="vbtn" data-size="1" aria-label="Trazo fino">Fino</button>
    <button class="vbtn" data-size="2" aria-label="Trazo medio">Medio</button>
    <button class="vbtn" data-size="3.5" aria-label="Trazo grueso">Grueso</button>
    <span class="sep"></span>
    <button class="vbtn" data-pen="eraser" aria-label="Goma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 20h12M4 15l9-9 6 6-7 7H8z"/></svg>Goma</button>
    <button class="vbtn" id="dUndo" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="vbtn" id="dClear">Borrar pág.</button>
    <button class="vbtn" id="dDone" style="color:#b8c0ff;font-weight:600">Listo</button>
  </div>

  <div id="player" class="panel" hidden>
    <button class="vbtn" id="pStart" aria-label="Volver al principio"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="3" height="14"/><path d="M20 5v14L9 12z"/></svg></button>
    <button class="vbtn" id="pToggle" aria-label="Reproducir" style="background:#2f3550"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button class="vbtn" id="pStop" aria-label="Detener"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
    <span class="sep"></span>
    <input id="pRate" type="range" min="25" max="200" step="5" value="100" aria-label="Velocidad">
    <span id="pRateL">100 %</span>
  </div>

  <div id="metro" class="panel" hidden>
    <button class="vbtn" id="mMinus" aria-label="Bajar tempo">−</button>
    <span id="mbpm">100</span>
    <button class="vbtn" id="mPlus" aria-label="Subir tempo">+</button>
    <input id="mbpmR" type="range" min="30" max="240" value="100" aria-label="Tempo">
    <select id="mbeats" aria-label="Tiempos por compás"></select>
    <button class="vbtn" id="mTap">Tap</button>
    <span id="mdot"></span>
    <button class="vbtn" id="mPlay" aria-label="Iniciar metrónomo" style="background:#2f3550"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>
  </div>
</div>

<div id="sheetBg" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
'use strict';
const CDN = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  osmd: 'https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js',
};

// ---------- utilidades ----------
const $ = (s) => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const icon = (d) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.innerHTML = d; return s; };
const ICON_MORE = '<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>';
let toastT;
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), ms); }
let vtoastT;
function vtoast(msg, ms = 1800) { const t = $('#vtoast'); t.textContent = msg; t.hidden = false; clearTimeout(vtoastT); vtoastT = setTimeout(() => (t.hidden = true), ms); }
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- almacenamiento (IndexedDB, con respaldo en memoria) ----------
const Store = (() => {
  const STORES = ['docs', 'files', 'anns', 'setlists', 'kv'];
  let db = null, mem = null;
  async function open() {
    try {

    get: (s, k) => db ? run(s, 'readonly', (o) => o.get(k)) : Promise.resolve(mem[s].get(k)),
    put: (s, k, v) => db ? run(s, 'readwrite', (o) => o.put(v, k)) : (mem[s].set(k, v), Promise.resolve()),

const scripts = {};
function loadScript(src) {

    const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = () => { delete scripts[src]; rej(new Error('No se pudo descargar ' + src.split('/').pop() + '. Revisá la conexión.')); };
    document.head.append(s);

}
async function getPdfjs() {

  const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];

}

// ---------- documentos ----------
function kindOf(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf' || file.type === 'application/pdf') return 'pdf';
  if (['musicxml', 'xml', 'mxl'].includes(ext) || /musicxml/.test(file.type)) return 'xml';
  if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp'].includes(ext) || /^image\/(png|jpe?g|webp|gif|bmp)$/.test(file.type)) return 'img';
  return null;
}
const baseName = (n) => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim() || n;

function loadImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob); const im = new Image();
    im.onload = () => res(im); im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    im.src = url;
  });
}
function imagesDoc(imgs) {
  return {
    pages: imgs.length,
    size: async (i) => ({ w: imgs[i].naturalWidth || imgs[i].width, h: imgs[i].naturalHeight || imgs[i].height }),
    async paint(i, cv) { const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.drawImage(imgs[i], 0, 0, cv.width, cv.height); },
    destroy() { imgs.forEach((im) => im.src.startsWith('blob:') && URL.revokeObjectURL(im.src)); },
  };
}
async function pdfDoc(blob) {
  const lib = await getPdfjs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false }).promise;
  const sizes = {};
  return {
    pages: pdf.numPages,
    async size(i) { if (!sizes[i]) { const v = (await pdf.getPage(i + 1)).getViewport({ scale: 1 }); sizes[i] = { w: v.width, h: v.height }; } return sizes[i]; },
    async paint(i, cv) {
      const p = await pdf.getPage(i + 1); const v1 = p.getViewport({ scale: 1 });
      const vp = p.getViewport({ scale: cv.width / v1.width });
      const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
      await p.render({ canvasContext: c, viewport: vp }).promise;
    },
    destroy() { pdf.destroy(); },
  };
}
function readBinary(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsBinaryString(blob); }); }
async function xmlDoc(blob, name) {
  const O = await getOsmd();
  const isZip = new Uint8Array(await blob.slice(0, 2).arrayBuffer()).join() === '80,75'; // "PK" = .mxl comprimido
  const content = isZip ? await readBinary(blob) : await blob.text();
  const host = h('div', { style: 'position:fixed;left:-30000px;top:0;width:1000px;background:#fff' });
  document.body.append(host);
  try {
    const osmd = new O.OpenSheetMusicDisplay(host, { autoResize: false, backend: 'svg', pageFormat: 'A4_P', pageBackgroundColor: '#FFFFFF', drawTitle: true });
    await osmd.load(content);
    osmd.render();
    const svgs = [...host.querySelectorAll('svg')];
    if (!svgs.length) throw new Error('La partitura no tiene contenido para mostrar');
    const events = musicEvents(osmd, svgs);
    const imgs = await Promise.all(svgs.map((svg) => {
      const r = svg.getBoundingClientRect();
      svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      svg.setAttribute('width', Math.round(r.width)); svg.setAttribute('height', Math.round(r.height));
      return loadImage(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
    }));
    const doc = imagesDoc(imgs); doc.events = events; return doc;
  } finally { host.remove(); }
}
// Recorre la partitura con el cursor de OSMD: notas (frecuencia, duración), tiempo en segundos y posición en la página.
function musicEvents(osmd, svgs) {
  const ev = [];
  try {
    const rects = svgs.map((s) => s.getBoundingClientRect());
    const c = osmd.cursor; c.show(); c.reset();
    let sec = 0, prevT = null, prevBpm = 120, prevMin = 0.25, guard = 0;
    while (!c.Iterator.EndReached && guard++ < 50000) {
      const it = c.Iterator, t = it.currentTimeStamp.RealValue;
      const bpm = (it.CurrentMeasure && it.CurrentMeasure.TempoInBPM) || prevBpm || 120;
      if (prevT !== null) { let d = t - prevT; if (d <= 0) d = prevMin; sec += d * 240 / prevBpm; }
      const notes = []; let min = Infinity;
      for (const n of c.NotesUnderCursor()) {
        const len = n.Length ? n.Length.RealValue : 0.25;
        if (len > 0) min = Math.min(min, len);
        if (n.isRest() || !n.Pitch) continue;
        const tie = n.NoteTie;
        if (tie && tie.StartNote && tie.StartNote !== n) continue;
        const total = tie && tie.Notes ? tie.Notes.reduce((a, x) => a + x.Length.RealValue, 0) : len;
        notes.push([n.Pitch.Frequency, Math.max(0.06, total * 240 / bpm)]);
      }
      const r = c.cursorElement.getBoundingClientRect();
      let p = rects.findIndex((q) => r.top + r.height / 2 >= q.top && r.top + r.height / 2 <= q.bottom); if (p < 0) p = 0;
      const q = rects[p];
      ev.push({ s: sec, n: notes, p, x: (r.left - q.left) / q.width, y: (r.top - q.top) / q.height, w: Math.max(r.width, 8) / q.width, h: r.height / q.height, bpm });
      prevT = t; prevBpm = bpm; prevMin = isFinite(min) ? min : prevMin;
      c.next();
    }
    c.hide();
  } catch (e) { console.warn('No se pudieron leer las notas', e); }
  return ev;
}
async function loadDoc(meta) {
  const f = await Store.get('files', meta.id);
  if (!f) throw new Error('No se encontró el archivo guardado de esta partitura.');
  if (meta.kind === 'pdf') return pdfDoc(f.blobs[0]);
  if (meta.kind === 'img') return imagesDoc(await Promise.all(f.blobs.map(loadImage)));
  return xmlDoc(f.blobs[0]);
}

// ---------- importar ----------
async function importFiles(list) {
  const files = [...list]; if (!files.length) return;
  const bad = [], imgs = [], added = [];
  toast('Importando…', 10000);
  for (const f of files) {
    const k = kindOf(f);
    if (!k) { bad.push(f.name); continue; }
    if (k === 'img') { imgs.push(f); continue; }
    added.push(await addDoc(baseName(f.name), k, [f]));
  }
  if (imgs.length) {
    imgs.sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true }));
    added.push(await addDoc(baseName(imgs[0].name), 'img', imgs));
  }
  await refresh();
  if (bad.length) toast('No se pudo abrir: ' + bad.join(', ') + ' (formato no soportado)', 4500);
  else toast(added.length === 1 ? 'Partitura agregada' : `${added.length} partituras agregadas`);
}

  const id = uid();
  const meta = { id, name, kind, pages: kind === 'img' ? blobs.length : null, last: 0, added: Date.now(), opened: 0, bpm: 100, beats: 4 };
  await Store.put('files', id, { blobs: blobs.map((b) => b.slice(0, b.size, b.type)) });

}

// ---------- ejemplo inicial ----------
function sampleXML() {
  const bars = ['E4q G4q C5q G4q', 'A4q F4q D4h', 'G4q E4q C4q E4q', 'D4w',
                'E4q G4q C5q E5q', 'D5q B4q G4h', 'A4q F4q D4q B3q', 'C4w'];
  const D = { q: [1, 'quarter'], h: [2, 'half'], w: [4, 'whole'] };
  const ms = bars.map((b, i) => {
    const notes = b.split(' ').map((n) => { const [, st, oc, d] = n.match(/([A-G])(\d)([qhw])/);
      return `<note><pitch><step>${st}</step><octave>${oc}</octave></pitch><duration>${D[d][0]}</duration><type>${D[d][1]}</type></note>`; }).join('');
    const attr = i === 0 ? '<attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>' : '';
    const bar = i === bars.length - 1 ? '<barline location="right"><bar-style>light-heavy</bar-style></barline>' : '';
    return `<measure number="${i + 1}">${attr}${notes}${bar}</measure>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8"?><score-partwise version="3.1"><work><work-title>Melodía de ejemplo</work-title></work><part-list><score-part id="P1"><part-name>Melodía</part-name></score-part></part-list><part id="P1">${ms}</part></score-partwise>`;
}

}

function placeMark(follow) {
  document.querySelectorAll('.mark').forEach((m) => m.remove());
  const e = P.mark; if (!e || !V.doc) return;
  const wrap = [...spread.children].find((w) => w._i === e.p);
  if (!wrap) { if (follow) { V.page = twoUp() ? e.p - (e.p % 2) : e.p; show(); } return; }
  const b = wrap._b, m = h('div', { class: 'mark' });
  m.style.cssText = `left:${(e.x * b.cw) - 4}px;top:${e.y * b.ch}px;width:${Math.max(e.w * b.cw + 8, 14)}px;height:${e.h * b.ch}px`;
  wrap.append(m);
  if (follow && stage.scrollHeight > stage.clientHeight + 4) {
    const r = m.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    if (r.top < sr.top + 40 || r.bottom > sr.bottom - 40) stage.scrollTo({ top: stage.scrollTop + r.top - sr.top - sr.height / 3, behavior: 'smooth' });
  }
}
$('#vPlay').onclick = () => {
  const p = $('#player'); p.hidden = !p.hidden; $('#vPlay').setAttribute('aria-pressed', !p.hidden);
  if (!p.hidden) { setDraw(false); $('#player').hidden = false; $('#vPlay').setAttribute('aria-pressed', 'true'); $('#metro').hidden = true; $('#vMetro').setAttribute('aria-pressed', 'false'); }
};
$('#pToggle').onclick = () => (P.on ? playPause() : playStart());
$('#pStop').onclick = () => playStop();
$('#pStart').onclick = () => { const was = P.on; if (was) playPause(); P.idx = 0; P.started = true; P.mark = V.doc.events[0]; placeMark(true); if (was) playStart(); };
let rateT;
$('#pRate').oninput = (e) => {
  const v = +e.target.value / 100, was = P.on; if (was) playPause();
  P.rate = v; playerUI(); if (was) playStart();
  clearTimeout(rateT); rateT = setTimeout(() => { V.meta.rate = Math.round(P.rate * 100); saveDoc(V.meta); }, 400);
};

// ---------- arranque ----------
$('#tabLib').onclick = () => { S.tab = 'lib'; renderLib(); };
$('#tabSets').onclick = () => { S.tab = 'sets'; renderLib(); };
$('#q').oninput = (e) => { S.q = e.target.value; renderLib(); };
$('#sortBtn').onclick = () => { S.sort = S.sort === 'az' ? 'recent' : 'az'; LS.set('atril.sort', S.sort); renderLib(); };
$('#fab').onclick = () => { if (S.tab === 'sets') newSetSheet((s) => { S.openSet = s.id; renderLib(); }); else $('#file').click(); };
$('#file').onchange = async (e) => { try { await importFiles(e.target.files); } catch (err) { toast('Error al importar: ' + (err.message || err), 4000); } e.target.value = ''; };
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });

(async () => {
  const ok = await Store.open();
  if (!ok) { const w = $('#warn'); w.hidden = false; w.textContent = 'Este navegador no deja guardar archivos: las partituras se pierden al cerrar la página.'; }
  else { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }
  try { await seedIfEmpty(); } catch {}
  await refresh();
})();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
