<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pomodoro</title>
<meta name="theme-color" content="#B23A2E" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root {
    --bg: #F7F3EE; --card: #FFFFFF; --text: #2A2320; --muted: #7A6F68; --line: #E6DED5;
    --work: #B23A2E; --short: #2E7D5B; --long: #2D5B8A; --accent: var(--work);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1B1716; --card: #26201E; --text: #F2ECE6; --muted: #A89D95; --line: #3A322F; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body[data-phase="short"] { --accent: var(--short); }
  body[data-phase="long"]  { --accent: var(--long); }
  main { max-width: 460px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.1rem; margin: 4px 0 14px; text-align: center; letter-spacing: .02em; }
  .tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); padding: 9px 4px;
    border-radius: 9px; font: inherit; font-size: .9rem; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .dial { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 22px auto 10px; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial circle { fill: none; stroke-width: 6; }
  .dial .track { stroke: var(--line); }
  .dial .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .4s linear; }
  .dial .center { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .time { font-size: clamp(3rem, 16vw, 4.4rem); font-weight: 700; font-variant-numeric: tabular-nums; }
  .phase-label { color: var(--muted); font-size: .95rem; margin-top: 2px; }
  .dots { display: flex; gap: 7px; justify-content: center; margin: 4px 0 18px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); }
  .dots span.done { background: var(--accent); }
  .controls { display: flex; gap: 10px; justify-content: center; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit;
    padding: 12px 18px; border-radius: 12px; cursor: pointer; min-width: 92px; }
  .btn.main { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700;
    min-width: 140px; font-size: 1.05rem; }
  .task { margin: 18px 0 0; }
  input[type=text], input[type=number], select { width: 100%; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 4px 14px; margin-top: 16px; }
  summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; padding-bottom: 14px; }
  .grid label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .grid .full { grid-column: 1 / -1; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row input[type=checkbox] { width: 18px; height: 18px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .hist-head { display: inline-flex; gap: 8px; align-items: baseline; }
  .hist-head .sum { color: var(--muted); font-size: .9rem; font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0 0 10px; }
  li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0;
    border-top: 1px solid var(--line); font-size: .92rem; }
  li .when { color: var(--muted); white-space: nowrap; }
  .empty { color: var(--muted); font-size: .9rem; padding: 0 0 12px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline;
    font: inherit; font-size: .85rem; cursor: pointer; padding: 0 0 12px; }
  .hint { color: var(--muted); font-size: .8rem; margin: 0; }
</style>
</head>
<body data-phase="work">
<main>
  <h1>🍅 Pomodoro</h1>

  <div class="tabs" role="tablist">
    <button data-phase="work">Trabajo</button>
    <button data-phase="short">Descanso corto</button>
    <button data-phase="long">Descanso largo</button>
  </div>

  <div class="dial">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="52" />
      <circle class="prog" id="prog" cx="60" cy="60" r="52" />
    </svg>
    <div class="center">
      <div class="time" id="time">25:00</div>
      <div class="phase-label" id="phaseLabel">Trabajo</div>
    </div>
  </div>

  <div class="dots" id="dots" title="Pomodoros del ciclo actual"></div>

  <div class="controls">
    <button class="btn" id="resetBtn" title="Reiniciar la fase actual">Reiniciar</button>
    <button class="btn main" id="startBtn">Iniciar</button>
    <button class="btn" id="skipBtn" title="Pasar a la fase siguiente">Saltar</button>
  </div>

  <div class="task">
    <input type="text" id="task" placeholder="¿En qué estás trabajando?" maxlength="80" />
  </div>

  <section>
    <details id="cfgBox">
      <summary>⚙️ Configuración</summary>
      <div class="grid">
        <label>Trabajo (min)<input type="number" id="cfgWork" min="1" max="180" /></label>
        <label>Descanso corto (min)<input type="number" id="cfgShort" min="1" max="60" /></label>
        <label>Descanso largo (min)<input type="number" id="cfgLong" min="1" max="120" /></label>
        <label>Pomodoros por ciclo<input type="number" id="cfgCycles" min="1" max="12" /></label>
        <label>Sonido
          <select id="cfgSound">
            <option value="campana">Campana</option>
            <option value="digital">Digital</option>
            <option value="suave">Suave</option>
            <option value="ninguno">Sin sonido</option>
          </select>
        </label>
        <label>Volumen<input type="range" id="cfgVolume" min="0" max="1" step="0.05" /></label>
        <div class="full row">
          <button class="btn" id="testSound" type="button">Probar sonido</button>
        </div>
        <label class="full row" style="flex-direction:row">
          <input type="checkbox" id="cfgNotify" /> Aviso del sistema al terminar cada fase
        </label>
        <p class="hint full" id="notifyHint"></p>
      </div>
    </details>
  </section>

  <section>
    <details id="histBox" open>
      <summary><span class="hist-head">📋 Hoy <span class="sum" id="histSum"></span></span></summary>
      <ul id="histList"></ul>
      <div class="empty" id="histEmpty">Todavía no completaste pomodoros hoy.</div>
      <button class="link" id="histClear" type="button">Borrar historial de hoy</button>
    </details>
  </section>
</main>

<script>
(() => {
  const LABELS = { work: "Trabajo", short: "Descanso corto", long: "Descanso largo" };
  const DEFAULTS = { work: 25, short: 5, long: 15, cycles: 4, sound: "campana", volume: 0.7, notify: false };
  const $ = (id) => document.getElementById(id);

  // ---------- almacenamiento ----------
  const load = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch { return def; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

  const cfg = { ...DEFAULTS, ...load("pomo.cfg", {}) };
  // estado: fase, pomodoros hechos en el ciclo, corriendo, fin (ms) o restante (ms)
  const st = { phase: "work", count: 0, running: false, endAt: 0, remaining: cfg.work * 60000, ...load("pomo.state", {}) };
  let hist = load("pomo.hist", { date: today(), items: [] });
  $("task").value = load("pomo.task", "");

  const phaseMs = (p) => cfg[p] * 60000;
  const persist = () => save("pomo.state", st);

  // ---------- sonido (Web Audio, sin archivos) ----------
  let actx = null;
  const audio = () => { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; };
  function tone(ctx, freq, start, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(ctx.destination); o.start(start); o.stop(start + dur + 0.05);
  }
  function playSound() {
    if (cfg.sound === "ninguno" || cfg.volume <= 0) return;
    let ctx; try { ctx = audio(); } catch { return; }
    const t = ctx.currentTime + 0.05, v = cfg.volume;
    if (cfg.sound === "campana") {
      for (let i = 0; i < 3; i++) { tone(ctx, 880, t + i * 0.9, 1.6, "sine", v); tone(ctx, 1320, t + i * 0.9, 1.0, "sine", v * 0.35); }
    } else if (cfg.sound === "digital") {
      for (let r = 0; r < 3; r++) for (let i = 0; i < 3; i++) tone(ctx, 1000, t + r * 0.8 + i * 0.15, 0.1, "square", v * 0.4);
    } else {
      tone(ctx, 523, t, 0.9, "triangle", v); tone(ctx, 659, t + 0.45, 0.9, "triangle", v); tone(ctx, 784, t + 0.9, 1.4, "triangle", v);
    }
  }

  // ---------- notificaciones ----------
  const canNotify = "Notification" in window;
  function notify(title, body) {
    if (!cfg.notify || !canNotify || Notification.permission !== "granted") return;
    const opts = { body, icon: "icon.svg", tag: "pomodoro", renotify: true };
    if (navigator.serviceWorker?.controller) navigator.serviceWorker.ready.then((r) => r.showNotification(title, opts)).catch(() => {});
    else try { new Notification(title, opts); } catch {}
  }
  function updateNotifyHint() {
    const h = $("notifyHint");
    if (!canNotify) h.textContent = "Este navegador no soporta avisos del sistema.";
    else if (Notification.permission === "denied") h.textContent = "Los avisos están bloqueados: habilitalos en la configuración del navegador para este sitio.";
    else h.textContent = "En el celular conviene instalar la app (Agregar a pantalla de inicio) para que los avisos funcionen con la pantalla apagada.";
  }

  // ---------- historial ----------
  function ensureToday() { if (hist.date !== today()) { hist = { date: today(), items: [] }; save("pomo.hist", hist); } }
  function addHistory() {
    ensureToday();
    const d = new Date();
    hist.items.unshift({ task: $("task").value.trim(), min: cfg.work, at: `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` });
    save("pomo.hist", hist);
  }
  function renderHistory() {
    ensureToday();
    const list = $("histList"); list.innerHTML = "";
    hist.items.forEach((it) => {
      const li = document.createElement("li");
      const a = document.createElement("span"); a.textContent = it.task || "(sin nombre)";
      const b = document.createElement("span"); b.className = "when"; b.textContent = `${it.min} min · ${it.at}`;
      li.append(a, b); list.append(li);
    });
    const n = hist.items.length, mins = hist.items.reduce((s, i) => s + i.min, 0);
    $("histSum").textContent = n ? `· ${n} 🍅 · ${Math.floor(mins / 60)}h ${mins % 60}m` : "";
    $("histEmpty").style.display = n ? "none" : "";
    $("histClear").style.display = n ? "" : "none";
  }

  // ---------- lógica del temporizador ----------
  const remainingMs = () => (st.running ? Math.max(0, st.endAt - Date.now()) : st.remaining);

  function setPhase(p, { keepCount = true } = {}) {
    st.phase = p; st.running = false; st.remaining = phaseMs(p);
    if (!keepCount) st.count = 0;
    persist(); render();
  }
  function nextPhase(completed) {
    if (st.phase === "work") {
      if (completed) addHistory();
      st.count += 1;
      if (st.count >= cfg.cycles) { st.count = 0; setPhase("long"); }
      else setPhase("short");
    } else setPhase("work");
    renderHistory();
  }
  function finish() {
    const was = st.phase;
    nextPhase(true);
    playSound();
    if (was === "work") notify("¡Pomodoro terminado! 🍅", `Ahora: ${LABELS[st.phase].toLowerCase()} de ${cfg[st.phase]} min.`);
    else notify("Fin del descanso", `A trabajar: ${cfg.work} min.`);
  }
  function start() { st.running = true; st.endAt = Date.now() + st.remaining; persist(); render(); }
  function pause() { st.remaining = remainingMs(); st.running = false; persist(); render(); }

  function tick() {
    if (st.running && remainingMs() <= 0) finish();
    renderTime();
  }

  // Reloj en un Web Worker: el navegador no lo frena tanto con la pestaña en segundo plano
  try {
    const src = "setInterval(() => postMessage(0), 500);";
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    w.onmessage = tick;
  } catch { setInterval(tick, 500); }
  document.addEventListener("visibilitychange", tick);

  // ---------- render ----------
  const CIRC = 2 * Math.PI * 52;
  $("prog").style.strokeDasharray = CIRC;
  const fmt = (ms) => { const s = Math.ceil(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

  function renderTime() {
    const ms = remainingMs(), total = phaseMs(st.phase);
    const t = fmt(ms);
    $("time").textContent = t;
    $("prog").style.strokeDashoffset = CIRC * (1 - Math.min(1, ms / total));
    document.title = st.running ? `${t} · ${LABELS[st.phase]}` : "Pomodoro";
  }
  function render() {
    document.body.dataset.phase = st.phase;
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.phase === st.phase));
    $("phaseLabel").textContent = LABELS[st.phase] + (st.running ? "" : " · en pausa");
    $("startBtn").textContent = st.running ? "Pausar" : (st.remaining < phaseMs(st.phase) ? "Continuar" : "Iniciar");
    const dots = $("dots"); dots.innerHTML = "";
    for (let i = 0; i < cfg.cycles; i++) { const s = document.createElement("span"); if (i < st.count) s.className = "done"; dots.append(s); }
    renderTime();
  }

  // ---------- eventos ----------
  $("startBtn").onclick = () => { try { audio(); } catch {} st.running ? pause() : start(); };
  $("resetBtn").onclick = () => setPhase(st.phase);
  $("skipBtn").onclick = () => nextPhase(false);
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => setPhase(b.dataset.phase));
  $("task").oninput = (e) => save("pomo.task", e.target.value);
  $("histClear").onclick = () => { if (confirm("¿Borrar el historial de hoy?")) { hist.items = []; save("pomo.hist", hist); renderHistory(); } };
  $("testSound").onclick = playSound;

  const fields = { cfgWork: "work", cfgShort: "short", cfgLong: "long", cfgCycles: "cycles" };
  for (const [id, key] of Object.entries(fields)) {
    const el = $(id); el.value = cfg[key];
    el.onchange = () => {
      const v = Math.round(Number(el.value));
      if (!v || v < Number(el.min) || v > Number(el.max)) { el.value = cfg[key]; return; }
      cfg[key] = v; save("pomo.cfg", cfg);
      if (key === "cycles") { if (st.count >= v) st.count = 0; persist(); }
      // si la fase cambiada está detenida y sin empezar, actualizar su duración
      if (key === st.phase && !st.running) { st.remaining = phaseMs(key); persist(); }
      render();
    };
  }
  $("cfgSound").value = cfg.sound;
  $("cfgSound").onchange = (e) => { cfg.sound = e.target.value; save("pomo.cfg", cfg); };
  $("cfgVolume").value = cfg.volume;
  $("cfgVolume").oninput = (e) => { cfg.volume = Number(e.target.value); save("pomo.cfg", cfg); };
  $("cfgNotify").checked = cfg.notify && canNotify && Notification.permission === "granted";
  $("cfgNotify").disabled = !canNotify;
  $("cfgNotify").onchange = async (e) => {
    if (e.target.checked && canNotify && Notification.permission !== "granted") {
      const p = await Notification.requestPermission();
      if (p !== "granted") e.target.checked = false;
    }
    cfg.notify = e.target.checked; save("pomo.cfg", cfg); updateNotifyHint();
  };

  // atajo: barra espaciadora = iniciar/pausar (fuera de campos de texto)
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) { e.preventDefault(); $("startBtn").click(); }
  });

  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

  updateNotifyHint();
  // si al reabrir ya pasó el tiempo, cerrar la fase
  if (st.running && remainingMs() <= 0) finish();
  render(); renderHistory();
})();
</script>
</body>
</html>
